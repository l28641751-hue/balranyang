name: iOS build check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'ios/**', 'capacitor.config.json', 'package.json', '.github/workflows/ios-check.yml']
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx cap sync ios
      - name: 시뮬레이터용 빌드 (서명 없이 컴파일만 확인)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -30
